# Purchase simulation + affordability parameters (PRD F6).
#
# ⚠️ MARKET DEFAULTS, NOT A QUOTE. Every figure below was researched on 2026-11-12 (see
# docs/research/morocco-purchase-financing.md) and is a typical/regulatory value for an existing
# apartment in Casablanca bought by a Moroccan living abroad (MRE). Replace them with the numbers
# from your bank's written offer, your notary's fee note and Simulation_achat_immo_MNM.xlsx as soon
# as you have them. Set any value to null and the simulation refuses to run rather than guess.
#
# Rates are fractions (0.04 = 4 %). Every non-zero figure has an entry in `sources:` at the bottom
# (URL, date, confidence) — tests/test_simulation.py fails if one is missing.
#
# Each acquisition cost line: amount = clamp(rate * base + fixed_mad, min_mad, max_mad) * (1 + vat_rate)
#   base: price | loan        applies: always | agency_listing | never
#   tiers: progressive brackets [{up_to, rate}] replacing `rate` (each rate on its own slice)
acquisition_costs:
  registration_duties:     # droits d'enregistrement
    label: Registration duties
    base: price
    rate: 0.04             # 4 % on built housing (CGI art. 133) — reaconsult/wafir guides 2026. Paying
                           # any part outside the banking system adds 2 points (LF 2026, price > 300k).
    fixed_mad: 0
    vat_rate: 0
    applies: always
  land_registry:           # conservation foncière (ANCFCC): transfer of the land title
    label: Land registry
    base: price
    rate: 0.015            # 1.5 % ad valorem since 2016-11-01 (décret 2-16-375)
    fixed_mad: 100         # fixed duty per title/certificate, 100 MAD (same decree)
    vat_rate: 0
    applies: always
  notary_fees:             # honoraires du notaire (+ TVA)
    label: Notary fees
    base: price
    rate: 0.01             # ~1 % in practice (guides give 0.5–1.5 %; no single enforced scale) — 2026
    fixed_mad: 0
    min_mad: 2500          # floor quoted 1 500–3 000 MAD depending on the source; irrelevant above 300k
    vat_rate: 0.10         # 10 % VAT on notary fees (most 2026 guides; one says 20 %)
    applies: always
  notary_disbursements:    # timbres, frais de dossier, copies
    label: Stamps and file costs
    base: price
    rate: 0
    fixed_mad: 2000        # 1 000–3 000 MAD quoted (valorisimo 2026); midpoint
    vat_rate: 0
    applies: always
  mortgage_registration:   # inscription de l'hypothèque (ANCFCC), on the loan amount
    label: Mortgage registration
    base: loan
    tiers:                 # progressive scale (fnh.ma; décret 2-16-375): 0.5 % / 1.5 % / 0.5 %
      - {up_to: 250000, rate: 0.005}
      - {up_to: 5000000, rate: 0.015}
      - {up_to: null, rate: 0.005}
    fixed_mad: 0
    vat_rate: 0
    applies: always
  agency_fee:              # commission agence, only when the listing is from an agency
    label: Agency commission
    base: price
    rate: 0.025            # 2.5 % buyer side, quoted tax-included (lesmre 2026); 2.5–3 %, negotiable
    fixed_mad: 0
    vat_rate: 0            # the 2.5 % above is already TTC — confirm in the agency mandate
    applies: agency_listing

# Base loan block. Scenarios below override individual fields; `default_scenario` is the one the
# pipeline, `radar simulate` and the public page use.
financing:
  down_payment_pct: 0.20       # share of price paid in cash
  min_down_payment_pct: 0.20   # MRE: dirham loans capped at 80 % of the price (Office des Changes 2026)
  finance_acquisition_costs: false   # true = costs added to the loan instead of paid cash
  annual_rate: 0.048           # nominal fixed rate before tax — MRE indicative 4.8 % (reaconsult 2026)
  interest_vat_rate: 0.10      # 10 % VAT on loan interest: bank rates are quoted "HT" (upsilon 2026)
  duration_years: 20
  insurance:
    mode: outstanding_capital  # initial_capital | outstanding_capital
    annual_rate: 0.0042        # décès-invalidité: 0.035 %/month of outstanding capital (lavieeco);
                               # 2026 guides give 0.25–0.60 %/yr by age and health
  bank_fees_mad: 6000          # frais de dossier (2 000–5 000) + mandatory valuation (1 500–3 500)

default_scenario: mre_typical
scenarios:
  mre_typical:
    label: MRE – typical bank
    profile: mre
    down_payment_pct: 0.20
    min_down_payment_pct: 0.20
    annual_rate: 0.048         # reaconsult MRE simulator 2026: 4.8 % in MAD
    duration_years: 20
  mre_best:
    label: MRE – best case
    profile: mre
    down_payment_pct: 0.20
    min_down_payment_pct: 0.20
    annual_rate: 0.0455        # lowest advertised rate of a major bank, June 2026 (Attijariwafa 4.55 %)
    duration_years: 25         # market maximum; the loan must end before age 70 (some banks 75)
  mre_prudent:
    label: MRE – cautious
    profile: mre
    down_payment_pct: 0.30     # the 30 % foreign-currency contribution many banks/guides still ask for
    min_down_payment_pct: 0.30
    annual_rate: 0.053         # top of Attijariwafa's advertised 4.55–5.30 % range, June 2026
    duration_years: 15
  resident:
    label: Morocco resident
    profile: resident
    down_payment_pct: 0.10
    min_down_payment_pct: 0    # no regulatory cap for residents; banks go to 100 % for stable profiles
    annual_rate: 0.0453        # Bank Al-Maghrib, average rate on new housing loans, Q2 2026
    duration_years: 25

affordability:
  max_debt_ratio: 0.40             # taux d'endettement: payment + other debts <= 40 % of net income
  monthly_net_income_eur: null     # buyer profile — fill in, or pass --income-eur to `radar afford`
  existing_monthly_debt_eur: 0     # other loan repayments, per month

# Running costs once you own (shown on the public page as a note; not part of the simulation).
ownership:
  syndic_monthly_mad: [400, 1200]      # co-ownership charges, standing buildings in Casablanca
  communal_services_tax_rate: 0.105    # taxe de services communaux, on the rental value (urban)

fx:
  sensitivity_pct: 0.05        # ± band on EUR/MAD for the EUR outputs (PRD: ±5 %)

rounding:
  # Excel ROUND semantics (half away from zero). Applied to outputs only, never mid-calculation.
  decimals: 0

# Where each figure comes from. Key = config path (a prefix covers everything under it).
# date = publication / entry into force when known, else the day it was consulted.
sources:
  acquisition_costs.registration_duties:
    url: https://reaconsult.ma/tendances-et-conseils-en-immobilier/droits-enregistrement-immobilier-maroc-cas-par-cas
    date: "2026"
    confidence: high
    note: 4 % housing, 5 % other built property; same figure in wafir.ma June 2026 guide. LF 2026 +2 points for non-bank payment (hespress.com 481145).
  acquisition_costs.land_registry:
    url: https://leseco.ma/business/droits-de-conservation-fonciere-le-compte-a-rebours-commence-pour-la-revision.html
    date: "2016-11-01"
    confidence: high
    note: Décret 2-16-375 of 2016-07-18 (BO 6484), 1 % -> 1.5 %, fixed duties raised to 100 MAD. Official text ancfcc.gov.ma/media/1165 not reachable from this session.
  acquisition_costs.notary_fees:
    url: https://www.lesmre.com/fr/guides/frais-notaire-achat-immobilier-maroc
    date: "2026"
    confidence: low
    note: Guides disagree (flat ~1 %, or sliding scales; floor 1 500–3 000 MAD; cap 48 000 MAD in one). wafir.ma calculator uses 1 % (min 2 500) + 10 % VAT. Ask the notary for a fee note.
  acquisition_costs.notary_disbursements:
    url: https://valorisimo.com/fr/frais-notaire-maroc-immobilier/
    date: "2026"
    confidence: low
    note: "\"Frais de dossier\" 1 000–3 000 MAD; midpoint used."
  acquisition_costs.mortgage_registration:
    url: https://fnh.ma/article/actualite-financiere-maroc/transactions-immobilieres-ce-qu-il-faut-savoir
    date: "2026-11-12"
    confidence: medium
    note: Consulted date (article undated in search results). Medias24 (Oct 2016) quotes a flat 1.5 %; wafir.ma 2026 a flat 0.5 %. The scale used sits between and is the most detailed.
  acquisition_costs.agency_fee:
    url: https://www.lesmre.com/fr/guides/frais-notaire-achat-immobilier-maroc
    date: "2026"
    confidence: low
    note: 2.5 % TTC, sometimes split buyer/seller; other guides 2.5–3 %. Not regulated.
  financing.down_payment_pct:
    url: https://www.oc.gov.ma/fr/mre/credits-pour-lacquisition-ou-la-construction-de-biens-immeubles
    date: "2026-01-01"
    confidence: medium
    note: Instruction Générale des Opérations de Change 2026, art. 793 — dirham loans to MRE up to 80 % of the price (70 % before). Reported by bladi.net 122290, snrtnews, h24info; official page not reachable from this session.
  financing.min_down_payment_pct:
    url: https://www.oc.gov.ma/fr/mre/credits-pour-lacquisition-ou-la-construction-de-biens-immeubles
    date: "2026-01-01"
    confidence: medium
    note: Same rule as financing.down_payment_pct.
  financing.annual_rate:
    url: https://reaconsult.ma/simulateur-credit-immobilier-mre-maroc
    date: "2026"
    confidence: low
    note: Indicative 4.8 % in MAD for MRE. Market range 4.5–5.8 % (reaconsult, baytima 2026); BAM average on new housing loans 4.53 % in Q2 2026.
  financing.interest_vat_rate:
    url: https://upsilon-consulting.com/tva-sur-les-operations-de-banque-et-de-credit/
    date: "2026"
    confidence: medium
    note: 10 % VAT on bank interest incl. housing loans; rates are advertised before tax (medias24 2018 "4,20 % HT"). Ask the bank whether its quote is HT or TTC.
  financing.duration_years:
    url: https://baytima.com/blog/credit-immobilier-maroc-2026-taux-conditions-banques
    date: "2026"
    confidence: medium
    note: Maximum 25 years at Attijariwafa, CIH, Banque Populaire (20 at BMCE in that table); 20 years taken as typical.
  financing.insurance:
    url: https://www.lavieeco.com/argent/assurance-deces-ce-quappliquent-les-banques-pour-les-credits-30082/
    date: "2021"
    confidence: low
    note: 0.035 % of outstanding capital per month (= 0.42 %/yr). 2026 guides give 0.25–0.60 %/yr depending on age/health; some banks charge on initial capital or a single premium.
  financing.bank_fees_mad:
    url: https://reaconsult.ma/faq/expertise-hypothecaire-qui-paie
    date: "2026"
    confidence: low
    note: Dossier fees 2 000–5 000 MAD + valuation 1 500–3 500 MAD (source sells valuations, may skew high). 3 500 + 2 500 used.
  scenarios.mre_typical:
    url: https://reaconsult.ma/simulateur-credit-immobilier-mre-maroc
    date: "2026"
    confidence: low
    note: 4.8 % MAD, 80 % financing, 20 years.
  scenarios.mre_best:
    url: https://wafir.ma/fr/barometre
    date: "2026-06"
    confidence: low
    note: Attijariwafa 4.55–5.30 %, Banque Populaire 4.60–5.40 %, 25 years max, 20 % down. Aggregator figures, not a bank tariff sheet. Medias24 2025-09-16 reported 4.35 % on 25 years.
  scenarios.mre_prudent:
    url: https://www.bladi.net/credit-immobilier-maroc-regle-mre-connaitre,121177.html
    date: "2026"
    confidence: low
    note: "\"30 % rule\": foreign-currency contribution from the pre-2026 regime, still applied by some banks. Rate = top of the wafir.ma June 2026 Attijariwafa range."
  scenarios.resident:
    url: https://www.bkam.ma/fr/content/download/849030/9173130/Taux%20d%C3%A9biteurs%20T2-2026.pdf
    date: "2026-08-11"
    confidence: medium
    note: BAM quarterly lending-rate survey Q2 2026 — housing loans 4.53 % (4.66 % in Q1), all real-estate loans 5.06 %, overall 4.81 %; via fnh.ma/boursenews. 100 % financing for stable resident profiles per wafir/reaconsult guides (10 % down assumed).
  affordability.max_debt_ratio:
    url: https://www.lesmre.com/fr/guides/credit-immobilier-mre-maroc
    date: "2026"
    confidence: medium
    note: Around 40 % of net income; some guides mention 45 % (even 50 %) for high incomes, others 33–40 %. Bank policy, not a regulation.
  ownership.syndic_monthly_mad:
    url: https://www.lesmre.com/fr/guides/syndic-copropriete-maroc-mre
    date: "2024"
    confidence: low
    note: 400–1 200 MAD/month in standing buildings in Casablanca.
  ownership.communal_services_tax_rate:
    url: https://upsilon-consulting.com/taxe-de-services-communaux-tsc/
    date: "2026"
    confidence: medium
    note: 10.5 % of the rental value in urban communes (6.5 % in peripheral zones), loi 47-06.
