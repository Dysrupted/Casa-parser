http:
  # Polite identification. RADAR_CONTACT from .env is appended if set.
  user_agent: "CasaRadar/0.1 (personal low-volume research bot)"
  min_delay_s: 5.0          # hard floor enforced in code: must be >= 3 (5 after a 429 from Mubawab)
  max_delay_s: 9.0
  timeout_s: 30
  max_retries: 2
  retry_backoff_s: 10
  cache_ttl_hours:
    search: 6               # same-day reruns hit the cache -> idempotent & polite
    detail: 168
    robots: 24
    api: 720               # geocoding answers (30 d); FX is keyed per day so never stale
    photo: 2160            # photos for duplicate detection (90 d)

pipeline:
  missing_runs_before_removed: 2   # complete crawls without the listing before status=removed
  refresh_detail_days: 7           # re-fetch detail page (raw snapshot) at most this often
  timezone: Africa/Casablanca      # calendar day used for snapshot/event uniqueness
  # Sites mix rentals into "for sale" results. Listings matching these are skipped at ingest.
  sale_filter:
    min_price_mad: 250000          # below this an "apartment for sale" is a rent or a typo
    exclude_title_regex: "\\b(a|à) louer\\b|\\blocation\\b|\\blouer\\b|par mois|/mois\\b"

sources:
  mubawab:
    enabled: true
    base_url: https://www.mubawab.ma
    # Verified 2026-11-12. Page 1 only: robots.txt disallows `/*:` which covers the `:p:N`
    # pagination, so each neighbourhood yields its first ~30 listings per day (newest/premium).
    # Consequence: the crawl is never "complete" -> no removal detection for Mubawab.
    search_urls:
      - https://www.mubawab.ma/fr/sd/casablanca/ain-diab/appartements-a-vendre
      - https://www.mubawab.ma/fr/sd/casablanca/anfa/appartements-a-vendre
      - https://www.mubawab.ma/fr/sd/casablanca/racine/appartements-a-vendre
      - https://www.mubawab.ma/fr/sd/casablanca/gauthier/appartements-a-vendre
    pagination: "{url}:p:{page}"    # page 1 = bare url (page 2+ blocked by robots.txt, see above)
    max_details_per_run: 25         # Mubawab's daily quota is ~25 detail pages; the rest wait for later runs
    id_pattern: "/p?a/(\\d+)"
    max_pages: 20
    fetch_details: true
    # Selector chains: first match wins. Tune here when the site changes, not in code.
    selectors:
      card: ["div.listingBox", "li.listingBox"]
      card_url: ["h2.listingTit a", "a[href*='/a/']"]
      card_url_attr: ["linkref"]
      title: ["h2.listingTit", "h2"]
      price: ["span.priceTag", ".priceTag"]
      location: ["h3.listingH3", "span.listingH3", ".listingH3"]
      features: ["div.adDetails span", ".adDetailFeature span"]
      card_photo: ["img.sliderImage", "img"]
      agency: ["div.businessLogo img", ".agencyName"]
      detail_description: ["div.blockProp p", "p.descLi", "div.description"]
      detail_photos: ["div.slider img", "div#masonryPhoto img", "img.imgSlider"]
      detail_features: ["div.adMainFeature span", "div.adFeature span", "div.mainInfoProp span"]
      amenities: ["div.adFeature span", "div.adFeatures span"]
      detail_agency: ["div.businessName", "p.link a", ".agencyName"]
      detail_address: ["h3.greyTit", "div.adMainInfo h3", ".locationAddress"]
      # Elements carrying map coordinates; first attr pair found wins.
      detail_geo: ["#mapOpen", "div[data-lat]", "[data-latitude]"]

  avito:
    enabled: true
    base_url: https://www.avito.ma
    # Verified 2026-11-12. Neighbourhood slugs don't filter on Avito, so crawl Casablanca
    # apartments newest-first and keep target zones locally. ~47 ads/page.
    search_urls:
      - https://www.avito.ma/fr/casablanca/appartements-%C3%A0_vendre
    pagination: "{url}?o={page}"
    max_pages: 8
    # Search results already carry description, photos, price and surface; the detail page's
    # JSON (`adInfo`) is an empty placeholder server-side. Skip it: half the requests.
    fetch_details: false
    id_pattern: "_(\\d+)\\.htm"
    embedded_json:
      script: "script#__NEXT_DATA__"
      # Each entry: list of alternative paths (first non-empty wins). "k=v" selects a list item.
      ads_paths:
        - [props, pageProps, componentProps, ads, ads]
        - [props, pageProps, initialReduxState, ad, search, ads]
      detail_ad_paths:
        - [props, pageProps, componentProps, adInfo, ad]
        - [props, pageProps, initialReduxState, ad, view, adInfo]
        - [props, pageProps, ad]
      fields:
        external_id: [[listId], [id]]
        url: [[href], [url]]
        title: [[subject], [title]]
        price: [[price, value], [price]]
        surface: [[params, secondary, "key=size", value], [params, size], [surface]]
        bedrooms: [[params, secondary, "key=rooms", value], [params, bedrooms]]   # Avito "rooms" = chambres
        bathrooms: [[params, secondary, "key=bathrooms", value]]
        location: [[location, area, name], [location]]
        agency: [[seller, name], [shopName]]
        photos: [[images], [photos]]
        description: [[description], [body]]
        address: [[location, address]]
        lat: [[location, coordinates, lat], [lat]]
        lon: [[location, coordinates, lng], [lng]]

  sarouty:
    # Disabled 2026-11-12: Sarouty answers 403 to user agents that identify as bots. We don't
    # spoof a browser UA, so this source stays off unless they allow it.
    enabled: false
    base_url: https://www.sarouty.ma
    # VERIFY on the live site.
    search_urls:
      - https://www.sarouty.ma/fr/acheter/casablanca/appartements-a-vendre-ain-diab.html
      - https://www.sarouty.ma/fr/acheter/casablanca/appartements-a-vendre-anfa.html
      - https://www.sarouty.ma/fr/acheter/casablanca/appartements-a-vendre-racine.html
      - https://www.sarouty.ma/fr/acheter/casablanca/appartements-a-vendre-gauthier.html
    pagination: "{url}?page={page}"
    max_pages: 20
    fetch_details: true
    id_pattern: "-(\\d{5,})\\.html"
    selectors:
      card: ["div.card-list__item", "article.card", "div[data-testid='property-card']"]
      card_url: ["a.card__link", "a[href$='.html']"]
      card_url_attr: []
      title: ["h2.card__title", ".card__title", "h2"]
      price: [".card__price-value", ".card__price", "[data-testid='property-card-price']"]
      location: [".card__location", "[data-testid='property-card-location']"]
      features: [".card__property-amenity", ".card__features li", "[data-testid='property-card-spec'] span"]
      card_photo: ["img.card__image", "img"]
      agency: [".card__broker-logo img", ".card__agent-name"]
      detail_description: [".property-description__text", "[data-testid='property-description']", ".description"]
      detail_photos: [".gallery img", ".property-gallery img"]
      detail_features: [".property-facts__content span", ".property-details li span"]
      detail_agency: [".agent-info__name", ".broker-name"]
      detail_address: [".property-location__text", ".location-address"]
      detail_geo: ["[data-lat]", "#map"]
