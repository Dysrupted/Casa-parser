[project]
name = "casa-radar"
version = "0.1.0"
description = "Casablanca apartment monitoring, pricing intelligence & purchase simulation"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=1.0",
  "pydantic>=2.6",
  "sqlmodel>=0.0.16",
  "pyyaml>=6",
  "typer>=0.12",
  "python-dotenv>=1",
  "alembic>=1.13",
  "anthropic>=2.8",
  "imagehash>=4.3",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
playwright = ["playwright>=1.40"]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
