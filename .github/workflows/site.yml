# Daily crawl -> public static site on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Optional secrets: ANTHROPIC_API_KEY (LLM extraction), TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (alerts).
name: Casa Radar site

on:
  schedule:
    - cron: "20 18 * * *"     # 18:20 UTC daily, after Mubawab's daily quota resets (~17:45 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: casa-radar-site
  cancel-in-progress: false

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # Keep the database (price history, first-seen dates, dedupe decisions) and the polite
      # HTTP cache between runs. Each run saves a new cache entry; the latest one is restored.
      - name: Restore data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-

      - name: Crawl
        id: crawl
        continue-on-error: true   # a failed or rate-limited site must not block publishing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_CONTACT: ${{ vars.RADAR_CONTACT }}
        run: radar run

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: radar-data-${{ github.run_id }}

      - name: Build site
        run: radar site --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: crawl-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
